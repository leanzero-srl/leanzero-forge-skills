## Required Scopes
- `read:events:admin`

## Common Action Filters
| Action | Description |
|--------|-------------|
| `user.created` | User added |
| `user.suspended` | User suspended |
| `user.restored` | User restored |
| `user.deleted` | User removed |
| `user.role.assigned` | Role granted |
| `user.role.revoked` | Role revoked |
| `policy.created` | Policy created |
| `policy.updated` | Policy updated |
| `policy.deleted` | Policy deleted |
| `domain.verified` | Domain verified |

## Notes
- Event data may be delayed by up to 24 hours
- Use `from` and `to` parameters for time-range queries
- The `events-stream` endpoint is optimized for polling (time-based)
- The `events` endpoint supports more granular filtering (actor, product, IP, etc.)
- Always paginate through results using the cursor
