# Audit Log Events
# Use Case: Compliance auditing, security monitoring, activity tracking

## Query Events (Granular Filtering)
GET /v1/orgs/{orgId}/events

### cURL
```bash
curl --request GET \
  --url 'https://api.atlassian.com/admin/v1/orgs/{orgId}/events?from=2025-01-01T00:00:00Z&to=2025-01-31T23:59:59Z&action=user.created&limit=50' \
  --header 'Authorization: Bearer <access_token>' \
  --header 'Accept: application/json'
```

### Query Parameters
| Parameter | Type | Description |
|-----------|------|-------------|
| `from` | string | Start time (ISO 8601) |
| `to` | string | End time (ISO 8601) |
| `action` | string | Filter by action type |
| `actor` | array | Filter by actor account IDs |
| `product` | array | Filter by product (jira-software, confluence, etc.) |
| `ip` | array | Filter by IP address |
| `q` | string | Full-text search query |
| `limit` | integer | Max results per page |

## Poll Events (Time-Based)
GET /v1/orgs/{orgId}/events-stream

### cURL
```bash
curl --request GET \
  --url 'https://api.atlassian.com/admin/v1/orgs/{orgId}/events-stream?from=2025-01-01T00:00:00Z&to=2025-01-31T23:59:59Z&sortOrder=desc' \
  --header 'Authorization: Bearer <access_token>' \
  --header 'Accept: application/json'
```

## Get Event by ID
GET /v1/orgs/{orgId}/events/{eventId}

### cURL
```bash
curl --request GET \
  --url 'https://api.atlassian.com/admin/v1/orgs/{orgId}/events/{eventId}' \
  --header 'Authorization: Bearer <access_token>' \
  --header 'Accept: application/json'
```

## List Event Actions
GET /v1/orgs/{orgId}/event-actions

### cURL
```bash
curl --request GET \
  --url 'https://api.atlassian.com/admin/v1/orgs/{orgId}/event-actions' \
  --header 'Authorization: Bearer <access_token>' \
  --header 'Accept: application/json'
```

