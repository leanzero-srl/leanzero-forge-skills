# Jira Workflow Condition Template

Copy this file and modify for your specific use case.

**The one fact that shapes everything below:** a `jira:workflowCondition` is a **Jira expression in the manifest**. Jira evaluates it itself; it never calls a Forge function. The manifest schema (`@forge/manifest` 12.9.0 `out/schema/manifest-schema.json`, `definitions.ModuleSchema.properties["jira:workflowCondition"]`) gives the module a REQUIRED `expression` and NO `function` property (a `jira:workflowValidator` has both). So a condition cannot call REST, KVS, a model or any network. A check that needs code is a validator (`templates/` validator, `docs/02-workflow-validators.md`).

## File: manifest.yml (add to modules section)

```yaml
modules:
  jira:workflowCondition:
    - key: my-condition               # REQUIRED: Unique identifier
      name: My Condition              # REQUIRED: Display name
      description: Shows the transition only when the configured field has a value  # REQUIRED
      # REQUIRED: the check. A Jira expression; Jira evaluates it, no function runs.
      # `config` is the configuration your config UI saved; `issue`, `user`, `project` are Jira's.
      # Guard every lookup: an expression that errors HIDES the transition.
      expression: >-
        config == null || config.fieldId == null ? true : issue?.[config.fieldId] != null

      projectTypes:
        - company-managed
        - team-managed

      # Optional: a Custom UI to configure the condition per transition.
      resolver:
        function: resolver            # backs the config UI's invoke() calls, never the check
      create:
        resource: condition-config-ui
      edit:
        resource: condition-config-ui

functions:
  - key: resolver
    handler: index.handler

resources:
  - key: condition-config-ui
    path: static/condition-config/build
```

## File: src/index.js (only the config UI's resolver; the condition itself has no code)

```javascript
import Resolver from '@forge/resolver';

const resolver = new Resolver();
// e.g. resolver.define('getFields', ...) to fill the config UI's field picker
export const handler = resolver.getDefinitions();
```

## File: static/condition-config/src/App.js (Custom UI config, optional)

```javascript
import React, { useEffect, useRef, useState } from 'react';
import { workflowRules } from '@forge/jira-bridge';

export default function App() {
  const [fieldId, setFieldId] = useState('');
  const fieldRef = useRef('');
  useEffect(() => { fieldRef.current = fieldId; }, [fieldId]);

  useEffect(() => {
    // Jira calls this when the admin saves the rule. The returned JSON string is the `config`
    // the manifest expression reads. Read from a ref: the callback is registered once.
    workflowRules.onConfigure(async () => JSON.stringify({ fieldId: fieldRef.current || null }));
  }, []);

  return (
    <label>
      Field that must have a value
      <input value={fieldId} onChange={(e) => setFieldId(e.target.value)} placeholder="customfield_10010" />
    </label>
  );
}
```

## Permissions Required

```yaml
permissions:
  scopes:
    - read:jira-work        # only if the config UI's resolver reads Jira data (e.g. a field list)
```


## Common Use Cases (expressions)

### Hide Transitions for Non-Managers

```yaml
expression: user.inGroup('jira-managers')
```

### Show Only in One Project (configured)

```yaml
expression: >-
  config == null || config.projectKey == null ? true : project.key == config.projectKey
```

### Show Once Your App Has Approved the Issue (data only code can compute)

Code elsewhere (a trigger, a post-function, a scheduled job) writes an issue property; the expression reads it:

```yaml
expression: >-
  issue.properties?.["myapp.checks"] == null ? true :
  issue.properties?.["myapp.checks"]?.approved == true
```

Decide on purpose what an absent property means (above: shown).

## Key Points

- The check is the manifest `expression`; there is no `{ result }` function and no handler to write
- `true` shows the transition, `false` hides it, and an ERROR hides it too: guard nulls
- No Forge invocation, no function timeout, no event when a condition is evaluated
- Anything that needs REST, KVS, a model or an external system is a validator, or is precomputed into an issue property
